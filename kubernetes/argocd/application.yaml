apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/samaysawal24/cloud-infrastructure-gitops.git"
    targetRevision: main
    path: kubernetes/base
  destination:
    server: "https://kubernetes.default.svc"
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
